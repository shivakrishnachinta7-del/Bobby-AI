
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152e">
  <title>BOBBY AI</title>
  <style>
    body {
      background: #07152e;
      color: #00bfff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    h1 { font-size: 38px; }
    p { color: white; }
    button {
      background: #008cff;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 25px;
    }
  </style>
  <link rel="manifest"      href="manifest.json">
<meta name="theme-color" content="#07152e">
</head>
<body>
  <h1>BOBBY AI</h1>
  <p>Your futuristic personal AI assistant.</p>
  <button onclick="sayHello()">
  Talk to BOBBY
  </button>
  <div id="chat-area">
  <h2>Chat with BOBBY</h2>

  <div id="messages">
    <p>BOBBY: Hello! How can I help    you?</p>
  </div>

  <input
    type="text"
    id="user-message"
    placeholder="Type your message..."
  >

  <button id="send-button">
    Send
  </button>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(
      "/Bobby-AI/service-worker.js"
    ).then(() => {
      console.log("BOBBY AI service worker registered!");
    }).catch(error => {
      console.error("Service worker registration failed:", error);
    });
  });
}
</script>
<script>
function sayHello() {
  alert("Hello! I am BOBBY AI. How can I help you?");
}
</script>
<script>
const input = document.getElementById("user-message");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("send-button");

function sendMessage() {
  const text = input.value.trim();

  if (text === "") {
    return;
  }

  // Display your message
  const userMessage = document.createElement("p");
  userMessage.textContent = "YOU: " + text;
  messages.appendChild(userMessage);

  // BOBBY's demo reply
  const bobbyMessage = document.createElement("p");
  bobbyMessage.textContent =
    "BOBBY: Hello! I received your message. I'm learning to assist you!";
  messages.appendChild(bobbyMessage);

  // Clear the input box
  input.value = "";
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>
</body>
</html>
