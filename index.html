
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152e">
  <title>BOBBY AI</title>
  <style>
    body {
      background: #07152e;
      color: #00bfff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    h1 { font-size: 38px; }
    p { color: white; }
    button {
      background: #008cff;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 25px;
    }
  </style>
  <link rel="manifest"      href="manifest.json">
<meta name="theme-color" content="#07152e">
</head>
<body>
  <h1>BOBBY AI</h1>
  <p>Your futuristic personal AI assistant.</p>
  <button onclick="alert('Hello! I am BOBBY AI.')">
    Start BOBBY AI
  </button>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(
      "/Bobby-AI/service-worker.js"
    ).then(() => {
      console.log("BOBBY AI service worker registered!");
    }).catch(error => {
      console.error("Service worker registration failed:", error);
    });
  });
}
</script>

</body>
</html>
